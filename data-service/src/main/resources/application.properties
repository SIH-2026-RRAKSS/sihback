spring.application.name=data-service

# Server Configuration
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/api

# Profiles
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Datasource Configuration (H2 Memory Mode)
spring.datasource.url=jdbc:h2:mem:sih_cybercrime;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Flyway Migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# JSON / Jackson Settings (camelCase, ISO-8601 UTC)
spring.jackson.property-naming-strategy=LOWER_CAMEL_CASE
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss.SSS'Z'
spring.jackson.time-zone=UTC
spring.jackson.serialization.write-dates-as-timestamps=false

# Actuator & Observability
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# SpringDoc OpenAPI / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Security & Encryption Configuration (Environment variable driven)
security.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
security.jwt.access-token-expiration-ms=900000
security.jwt.refresh-token-expiration-ms=604800000
security.hmac.secret=${HMAC_SECRET_KEY:c3VwZXJzZWNyZXRobWFja2V5MTIzNDU2Nzg5MDEyMzQ1Njc4OTA=}
security.encryption.key=${DATA_ENCRYPTION_KEY:MTIzNDU2Nzg5MDEyMzQ1Ng==}

# Integration URLs & Storage Paths
model.service.url=${MODEL_SERVICE_URL:http://localhost:8001}
storage.evidence.path=${STORAGE_EVIDENCE_PATH:../storage/evidence}
storage.snapshots.path=${STORAGE_SNAPSHOTS_PATH:../storage/snapshots}

# WhatsApp Webhook Configuration
whatsapp.webhook.verify-token=${WHATSAPP_VERIFY_TOKEN:sih_whatsapp_verify_token_2026}
whatsapp.webhook.secret=${WHATSAPP_WEBHOOK_SECRET:sih_whatsapp_webhook_secret_key_2026}

